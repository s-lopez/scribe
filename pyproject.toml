[project]
name = "scribe"
version = "0.1.0"
description = "Local dictation and audio transcription (whisper.cpp) with optional refinement (Ollama or Claude Code)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
scribe = "scribe.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: runs the real whisper.cpp / ffmpeg / ollama / claude tools (slow)"]
